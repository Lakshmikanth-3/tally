specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SettlementAnchor
    network: sepolia
    source:
      address: "0xFa5FE1d656B9d2D382D9Fc717Bd22c1f79Add9f4"
      abi: SettlementAnchor
      startBlock: 11689158
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Bond
        - LifecycleEvent
        - IssuerStanding
      abis:
        - name: SettlementAnchor
          file: ./abis/SettlementAnchor.json
      eventHandlers:
        - event: LifecycleEvent(indexed bytes32,indexed address,uint8,uint256,bool,string)
          handler: handleLifecycleEvent
      file: ./src/mapping.ts
